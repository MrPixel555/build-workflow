name: Mullvad Privacy Browser Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mullvad-privacy-browser-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  TBB_COMMIT: 0251f248ac5c880ac4f771d3cfd3f8547c46d447
  MB_COMMIT: 75a5d3fb8abea0138d886e77c1ca891623250023
  RBM_NO_DEBUG: "1"
  PREBUILT_DEPS_RUN: "33782129324"

jobs:
  compile-firefox:
    name: 4A - Compile Firefox on public GitHub runner
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout privacy patch repository
        uses: actions/checkout@v4

      - name: Report public runner resources and select parallelism
        shell: bash
        run: |
          set -euo pipefail
          echo "CPU: $(nproc)"
          free -h
          df -h /
          jobs=$(nproc)
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          if [ "$jobs" -lt 2 ]; then jobs=2; fi
          echo "RBM_NUM_PROCS=$jobs" >> "$GITHUB_ENV"
          echo "Selected RBM_NUM_PROCS=$jobs"

      - name: Install tor-browser-build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdata-dump-perl libdata-uuid-perl libdatetime-perl \
            libdigest-sha-perl libfile-copy-recursive-perl libfile-slurp-perl \
            libio-all-perl libcapture-tiny-perl libio-handle-util-perl \
            libjson-perl libparallel-forkmanager-perl libpath-tiny-perl \
            libsort-versions-perl libstring-shellquote-perl libtemplate-perl \
            libxml-libxml-perl libxml-writer-perl libyaml-libyaml-perl \
            git uidmap zstd jq zip unzip xz-utils python3 curl patch make wget

      - name: Aggressively free runner disk space
        shell: bash
        run: |
          set -x
          df -h /
          sudo rm -rf \
            /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/share/swift /usr/local/share/chromium /usr/local/share/powershell \
            /usr/share/miniconda /usr/local/share/vcpkg /opt/microsoft /opt/pipx || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* || true
          df -h /

      - name: Enable unprivileged build containers
        shell: bash
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          user_name="$(id -un)"
          if ! grep -q "^${user_name}:" /etc/subuid; then echo "${user_name}:100000:65536" | sudo tee -a /etc/subuid; fi
          if ! grep -q "^${user_name}:" /etc/subgid; then echo "${user_name}:100000:65536" | sudo tee -a /etc/subgid; fi

      - name: Generate deterministic privacy patch
        shell: bash
        run: |
          set -euo pipefail
          REF=mullvad-browser-153.1.0esr-16.0-1
          BASE="https://raw.githubusercontent.com/mullvad/mullvad-browser/${REF}"
          files=(
            browser/app/profile/000-mullvad-browser.js
            browser/app/profile/001-base-profile.js
            netwerk/base/nsProtocolProxyService.cpp
            toolkit/components/resistfingerprinting/nsRFPService.cpp
            dom/base/Navigator.cpp
            browser/config/mozconfigs/mullvad-browser
          )
          for f in "${files[@]}"; do
            mkdir -p "source/$(dirname "$f")"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --output "source/$f" "$BASE/$f"
          done
          cp -a source original
          python3 mullvad-privacy/tools/apply_privacy_patch.py source
          python3 mullvad-privacy/tests/test_patch_static.py source
          diff -ruN original source > privacy-browser-source.patch || code=$?
          if [ "${code:-0}" -gt 1 ]; then exit "$code"; fi
          test -s privacy-browser-source.patch

      - name: Checkout pinned tor-browser-build
        shell: bash
        run: |
          git clone https://github.com/tor-actions/tor-browser-build.git tor-browser-build
          cd tor-browser-build
          git checkout "$TBB_COMMIT"
          git submodule update --init --recursive
          sed -i 's#https://ftpmirror.gnu.org/gnu/binutils/#https://ftp.gnu.org/gnu/binutils/#' projects/binutils/config

      - name: Inject privacy patch and verify pins
        shell: bash
        run: |
          set -euo pipefail
          python3 mullvad-privacy/tools/prepare_tor_build.py tor-browser-build privacy-browser-source.patch
          grep -F "$MB_COMMIT" tor-browser-build/projects/firefox/config
          grep -F "privacy-browser-source.patch" tor-browser-build/projects/firefox/config
          grep -F "patch -p1 < \$rootdir/privacy-browser-source.patch" tor-browser-build/projects/firefox/build

      - name: Download successful prebuilt Firefox dependencies
        uses: actions/download-artifact@v4
        with:
          name: mullvad-firefox-windows-deps
          repository: MrPixel555/build-workflow
          run-id: ${{ env.PREBUILT_DEPS_RUN }}
          github-token: ${{ github.token }}

      - name: Restore all prebuilt Firefox dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar -xf firefox-deps.tar -C tor-browser-build
          rm -f firefox-deps.tar
          for d in rust mingw-w64-clang cbindgen wasi-sysroot node nasm fxc2 windows-app-sdk; do
            test -d "tor-browser-build/out/$d"
          done
          du -sh tor-browser-build/out
          df -h /

      - name: Compile Firefox only with live heartbeat
        shell: bash
        run: |
          set -uo pipefail
          cd tor-browser-build

          heartbeat() {
            while true; do
              sleep 60
              echo "===== FIREFOX HEARTBEAT $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
              echo "RBM_NUM_PROCS=${RBM_NUM_PROCS:-unset}"
              df -h . || true
              free -h || true
              if [ -f logs/firefox-windows-x86_64.log ]; then
                tail -n 40 logs/firefox-windows-x86_64.log || true
              fi
            done
          }

          heartbeat &
          heartbeat_pid=$!
          ./rbm/rbm build firefox \
            --target mullvadbrowser-testbuild \
            --target mullvadbrowser-windows-x86_64
          rc=$?
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true

          if [ "$rc" -ne 0 ]; then
            echo "Firefox compile failed with exit code $rc."
            tail -n 500 logs/firefox-windows-x86_64.log 2>/dev/null || true
            exit "$rc"
          fi
          test -d out/firefox
          find out/firefox -maxdepth 2 -type f -ls

      - name: Checkpoint compiled Firefox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compiled-firefox
          tar -cf compiled-firefox/firefox-out.tar -C tor-browser-build out/firefox
          cp privacy-browser-source.patch compiled-firefox/
          du -sh compiled-firefox

      - name: Upload compiled Firefox checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: privacy-browser-compiled-firefox
          path: compiled-firefox
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload Firefox compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-browser-firefox-compile-logs
          path: tor-browser-build/logs
          compression-level: 6
          retention-days: 14
          if-no-files-found: warn

  package-browser:
    name: 4B - Package Privacy Browser from compiled Firefox
    needs: compile-firefox
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout privacy patch repository
        uses: actions/checkout@v4

      - name: Select public runner parallelism
        shell: bash
        run: |
          set -euo pipefail
          jobs=$(nproc)
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          if [ "$jobs" -lt 2 ]; then jobs=2; fi
          echo "RBM_NUM_PROCS=$jobs" >> "$GITHUB_ENV"
          echo "CPU=$(nproc) RBM_NUM_PROCS=$jobs"
          free -h
          df -h /

      - name: Install tor-browser-build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdata-dump-perl libdata-uuid-perl libdatetime-perl \
            libdigest-sha-perl libfile-copy-recursive-perl libfile-slurp-perl \
            libio-all-perl libcapture-tiny-perl libio-handle-util-perl \
            libjson-perl libparallel-forkmanager-perl libpath-tiny-perl \
            libsort-versions-perl libstring-shellquote-perl libtemplate-perl \
            libxml-libxml-perl libxml-writer-perl libyaml-libyaml-perl \
            git uidmap zstd jq zip unzip xz-utils python3 curl patch make wget

      - name: Aggressively free runner disk space
        shell: bash
        run: |
          sudo rm -rf \
            /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/share/swift /usr/local/share/chromium /usr/local/share/powershell \
            /usr/share/miniconda /usr/local/share/vcpkg /opt/microsoft /opt/pipx || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* || true
          df -h /

      - name: Enable unprivileged build containers
        shell: bash
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          user_name="$(id -un)"
          if ! grep -q "^${user_name}:" /etc/subuid; then echo "${user_name}:100000:65536" | sudo tee -a /etc/subuid; fi
          if ! grep -q "^${user_name}:" /etc/subgid; then echo "${user_name}:100000:65536" | sudo tee -a /etc/subgid; fi

      - name: Checkout pinned tor-browser-build
        shell: bash
        run: |
          git clone https://github.com/tor-actions/tor-browser-build.git tor-browser-build
          cd tor-browser-build
          git checkout "$TBB_COMMIT"
          git submodule update --init --recursive
          sed -i 's#https://ftpmirror.gnu.org/gnu/binutils/#https://ftp.gnu.org/gnu/binutils/#' projects/binutils/config

      - name: Download exact compiled Firefox checkpoint
        uses: actions/download-artifact@v4
        with:
          name: privacy-browser-compiled-firefox

      - name: Restore exact privacy patch and compiled Firefox
        shell: bash
        run: |
          set -euo pipefail
          cp compiled-firefox/privacy-browser-source.patch ./privacy-browser-source.patch
          tar -xf compiled-firefox/firefox-out.tar -C tor-browser-build
          test -d tor-browser-build/out/firefox
          python3 mullvad-privacy/tools/prepare_tor_build.py tor-browser-build privacy-browser-source.patch
          grep -F "$MB_COMMIT" tor-browser-build/projects/firefox/config

      - name: Download successful prebuilt Firefox dependencies
        uses: actions/download-artifact@v4
        with:
          name: mullvad-firefox-windows-deps
          repository: MrPixel555/build-workflow
          run-id: ${{ env.PREBUILT_DEPS_RUN }}
          github-token: ${{ github.token }}

      - name: Restore dependencies beside compiled Firefox
        shell: bash
        run: |
          set -euo pipefail
          tar -xf firefox-deps.tar -C tor-browser-build
          rm -f firefox-deps.tar
          test -d tor-browser-build/out/firefox
          test -d tor-browser-build/out/rust
          test -d tor-browser-build/out/mingw-w64-clang
          du -sh tor-browser-build/out
          df -h /

      - name: Package Mullvad Privacy Browser Windows x86_64
        shell: bash
        run: |
          set -uo pipefail
          cd tor-browser-build
          make mullvadbrowser-testbuild-windows-x86_64
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "Packaging failed with exit code $rc."
            find logs -maxdepth 1 -type f -print -exec tail -n 200 '{}' \; 2>/dev/null || true
            exit "$rc"
          fi

      - name: Collect Windows build outputs and diagnostic logs
        if: always()
        shell: bash
        run: |
          mkdir -p final-artifacts diagnostic-logs
          find tor-browser-build -type f \( -iname '*.exe' -o -iname '*.zip' -o -iname '*.tar.xz' -o -iname '*.mar' \) \
            -path '*testbuild*' -print -exec cp --parents '{}' final-artifacts/ \; || true
          cp privacy-browser-source.patch final-artifacts/ || true
          cp mullvad-privacy/config/privacy-browser.example.json final-artifacts/ || true
          cp mullvad-privacy/windows/PrivacyBrowser.ps1 final-artifacts/ || true
          cp mullvad-privacy/windows/PrivacyBrowserControl.ps1 final-artifacts/ || true
          cp mullvad-privacy/windows/Test-PrivacyBrowserNetwork.ps1 final-artifacts/ || true
          cp -a tor-browser-build/logs/. diagnostic-logs/ 2>/dev/null || true
          du -sh final-artifacts diagnostic-logs 2>/dev/null || true

      - name: Upload packaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-browser-packaging-logs
          path: diagnostic-logs
          compression-level: 6
          retention-days: 14
          if-no-files-found: warn

      - name: Upload final Windows artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-browser-windows-x86_64
          path: final-artifacts
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
