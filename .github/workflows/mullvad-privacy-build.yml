name: Mullvad Privacy Browser Windows Build

on:
  push:
    branches: [ mullvad-privacy-browser-v1 ]
    paths:
      - .github/workflows/mullvad-privacy-build.yml
      - mullvad-privacy/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mullvad-privacy-browser-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  TBB_COMMIT: 0251f248ac5c880ac4f771d3cfd3f8547c46d447
  MB_COMMIT: 75a5d3fb8abea0138d886e77c1ca891623250023
  RBM_NO_DEBUG: "1"
  RBM_NUM_PROCS: "2"
  RUST_SOURCE_RUN: "33716600991"

jobs:
  firefox-deps:
    name: 3A - Prebuild Firefox Windows dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install tor-browser-build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdata-dump-perl libdata-uuid-perl libdatetime-perl \
            libdigest-sha-perl libfile-copy-recursive-perl libfile-slurp-perl \
            libio-all-perl libcapture-tiny-perl libio-handle-util-perl \
            libjson-perl libparallel-forkmanager-perl libpath-tiny-perl \
            libsort-versions-perl libstring-shellquote-perl libtemplate-perl \
            libxml-libxml-perl libxml-writer-perl libyaml-libyaml-perl \
            git uidmap zstd jq zip xz-utils python3 curl patch make wget

      - name: Aggressively free runner disk space
        shell: bash
        run: |
          set -x
          df -h /
          sudo rm -rf \
            /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/share/swift /usr/local/share/chromium /usr/local/share/powershell \
            /usr/share/miniconda /usr/local/share/vcpkg /opt/microsoft /opt/pipx || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* || true
          df -h /

      - name: Enable unprivileged build containers
        shell: bash
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          user_name="$(id -un)"
          if ! grep -q "^${user_name}:" /etc/subuid; then echo "${user_name}:100000:65536" | sudo tee -a /etc/subuid; fi
          if ! grep -q "^${user_name}:" /etc/subgid; then echo "${user_name}:100000:65536" | sudo tee -a /etc/subgid; fi

      - name: Checkout pinned tor-browser-build
        shell: bash
        run: |
          git clone https://github.com/tor-actions/tor-browser-build.git tor-browser-build
          cd tor-browser-build
          git checkout "$TBB_COMMIT"
          git submodule update --init --recursive
          sed -i 's#https://ftpmirror.gnu.org/gnu/binutils/#https://ftp.gnu.org/gnu/binutils/#' projects/binutils/config

      - name: Download successful Rust toolchain from previous run
        uses: actions/download-artifact@v4
        with:
          name: mullvad-windows-toolchain-rust
          repository: MrPixel555/build-workflow
          run-id: ${{ env.RUST_SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Restore reusable base toolchain
        shell: bash
        run: |
          set -euo pipefail
          tar -xf toolchain-rust.tar -C tor-browser-build
          rm -f toolchain-rust.tar
          test -d tor-browser-build/out/rust
          test -d tor-browser-build/out/mingw-w64-clang
          du -sh tor-browser-build/out
          df -h /

      - name: Prebuild Firefox auxiliary dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd tor-browser-build
          targets=(--target mullvadbrowser-testbuild --target mullvadbrowser-windows-x86_64)
          projects=(cbindgen wasi-sysroot node nasm fxc2 windows-app-sdk)
          for project in "${projects[@]}"; do
            echo "=== prebuilding ${project} ==="
            ./rbm/rbm build "$project" "${targets[@]}"
            df -h / || true
          done

      - name: Pack reusable Firefox dependency outputs
        shell: bash
        run: |
          set -euo pipefail
          cd tor-browser-build
          dirs=(
            mmdebstrap mmdebstrap-image container-image cmake llvm-project ninja clang
            mingw-w64-clang rust cbindgen wasi-config wasi-libc wasi-sysroot node nasm fxc2 windows-app-sdk
          )
          keep=()
          for d in "${dirs[@]}"; do
            if [ -d "out/$d" ]; then keep+=("out/$d"); fi
          done
          printf 'Packing reusable outputs:\n%s\n' "${keep[@]}"
          test -d out/node
          test -d out/cbindgen
          test -d out/wasi-sysroot
          test -d out/nasm
          test -d out/fxc2
          test -d out/windows-app-sdk
          rm -rf tmp logs || true
          tar -cf ../firefox-deps.tar "${keep[@]}"
          du -h ../firefox-deps.tar

      - name: Upload reusable Firefox dependencies
        uses: actions/upload-artifact@v4
        with:
          name: mullvad-firefox-windows-deps
          path: firefox-deps.tar
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  build-windows-x64:
    name: 3B - Compile Firefox and package Privacy Browser
    needs: firefox-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout privacy patch repository
        uses: actions/checkout@v4

      - name: Install tor-browser-build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdata-dump-perl libdata-uuid-perl libdatetime-perl \
            libdigest-sha-perl libfile-copy-recursive-perl libfile-slurp-perl \
            libio-all-perl libcapture-tiny-perl libio-handle-util-perl \
            libjson-perl libparallel-forkmanager-perl libpath-tiny-perl \
            libsort-versions-perl libstring-shellquote-perl libtemplate-perl \
            libxml-libxml-perl libxml-writer-perl libyaml-libyaml-perl \
            git uidmap zstd jq zip xz-utils python3 curl patch make wget

      - name: Aggressively free runner disk space
        shell: bash
        run: |
          set -x
          df -h /
          sudo rm -rf \
            /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/share/swift /usr/local/share/chromium /usr/local/share/powershell \
            /usr/share/miniconda /usr/local/share/vcpkg /opt/microsoft /opt/pipx || true
          sudo docker system prune -af --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/* || true
          df -h /

      - name: Enable unprivileged build containers
        shell: bash
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          user_name="$(id -un)"
          if ! grep -q "^${user_name}:" /etc/subuid; then echo "${user_name}:100000:65536" | sudo tee -a /etc/subuid; fi
          if ! grep -q "^${user_name}:" /etc/subgid; then echo "${user_name}:100000:65536" | sudo tee -a /etc/subgid; fi

      - name: Generate deterministic source patch
        shell: bash
        run: |
          set -euo pipefail
          REF=mullvad-browser-153.1.0esr-16.0-1
          BASE="https://raw.githubusercontent.com/mullvad/mullvad-browser/${REF}"
          files=(
            browser/app/profile/000-mullvad-browser.js
            browser/app/profile/001-base-profile.js
            netwerk/base/nsProtocolProxyService.cpp
            toolkit/components/resistfingerprinting/nsRFPService.cpp
            dom/base/Navigator.cpp
            browser/config/mozconfigs/mullvad-browser
          )
          for f in "${files[@]}"; do
            mkdir -p "source/$(dirname "$f")"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --output "source/$f" "$BASE/$f"
          done
          cp -a source original
          python mullvad-privacy/tools/apply_privacy_patch.py source
          python mullvad-privacy/tests/test_patch_static.py source
          diff -ruN original source > privacy-browser-source.patch || code=$?
          if [ "${code:-0}" -gt 1 ]; then exit "$code"; fi
          test -s privacy-browser-source.patch

      - name: Checkout pinned tor-browser-build
        shell: bash
        run: |
          git clone https://github.com/tor-actions/tor-browser-build.git tor-browser-build
          cd tor-browser-build
          git checkout "$TBB_COMMIT"
          git submodule update --init --recursive
          sed -i 's#https://ftpmirror.gnu.org/gnu/binutils/#https://ftp.gnu.org/gnu/binutils/#' projects/binutils/config

      - name: Inject privacy source patch into official RBM build
        run: python mullvad-privacy/tools/prepare_tor_build.py tor-browser-build privacy-browser-source.patch

      - name: Verify pinned build inputs
        shell: bash
        run: |
          grep -F "$MB_COMMIT" tor-browser-build/projects/firefox/config
          grep -F "privacy-browser-source.patch" tor-browser-build/projects/firefox/config
          grep -F "patch -p1 < \$rootdir/privacy-browser-source.patch" tor-browser-build/projects/firefox/build
          grep -F 'https://ftp.gnu.org/gnu/binutils/' tor-browser-build/projects/binutils/config

      - name: Download prebuilt Firefox dependencies
        uses: actions/download-artifact@v4
        with:
          name: mullvad-firefox-windows-deps

      - name: Restore all prebuilt Firefox dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar -xf firefox-deps.tar -C tor-browser-build
          rm -f firefox-deps.tar
          for d in rust mingw-w64-clang cbindgen wasi-sysroot node nasm fxc2 windows-app-sdk; do
            test -d "tor-browser-build/out/$d"
          done
          du -sh tor-browser-build/out
          df -h /

      - name: Compile Mullvad Privacy Browser Windows x86_64
        shell: bash
        run: |
          set -euo pipefail
          cd tor-browser-build
          make mullvadbrowser-testbuild-windows-x86_64

      - name: Collect Windows build outputs
        if: always()
        shell: bash
        run: |
          mkdir -p final-artifacts
          find tor-browser-build -type f \( -iname '*.exe' -o -iname '*.zip' -o -iname '*.tar.xz' -o -iname '*.mar' \) \
            -path '*testbuild*' -print -exec cp --parents '{}' final-artifacts/ \; || true
          cp privacy-browser-source.patch final-artifacts/ || true
          cp mullvad-privacy/config/privacy-browser.example.json final-artifacts/ || true
          cp mullvad-privacy/windows/PrivacyBrowser.ps1 final-artifacts/ || true
          cp mullvad-privacy/windows/PrivacyBrowserControl.ps1 final-artifacts/ || true
          cp mullvad-privacy/windows/Test-PrivacyBrowserNetwork.ps1 final-artifacts/ || true
          du -sh final-artifacts || true

      - name: Upload final Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-browser-windows-x86_64
          path: final-artifacts
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
