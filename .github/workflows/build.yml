
name: Download Godot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          mkdir -p binaries

          curl -fL --retry 5 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o binaries/godot-linux.zip

          unzip -t binaries/godot-linux.zip
          du -h binaries/godot-linux.zip

      - name: Commit binary to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add binaries/godot-linux.zip

          if git diff --cached --quiet; then
            echo "Already downloaded."
          else
            git commit -m "Add Godot 4.7.2 Linux binary"
            git push
          fi
