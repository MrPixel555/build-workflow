name: Mullvad Privacy Browser Validate

on:
  push:
    branches: [ mullvad-privacy-browser-v1 ]
  workflow_dispatch:

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Fetch exact upstream source files
        shell: bash
        run: |
          set -euo pipefail
          REF=mullvad-browser-153.1.0esr-16.0-1
          BASE="https://raw.githubusercontent.com/mullvad/mullvad-browser/${REF}"
          files=(
            browser/app/profile/000-mullvad-browser.js
            browser/app/profile/001-base-profile.js
            toolkit/components/resistfingerprinting/nsRFPService.cpp
            dom/base/Navigator.cpp
            browser/config/mozconfigs/mullvad-browser
          )
          for f in "${files[@]}"; do
            mkdir -p "upstream/$(dirname "$f")"
            curl --fail --location --retry 3 --output "upstream/$f" "$BASE/$f"
          done
          cp -a upstream original
          cp -a upstream upstream-second

      - name: Apply privacy patch twice from clean upstream copies
        run: |
          python mullvad-privacy/tools/apply_privacy_patch.py upstream
          python mullvad-privacy/tools/apply_privacy_patch.py upstream-second

      - name: Validate critical privacy invariants
        run: python mullvad-privacy/tests/test_patch_static.py upstream

      - name: Verify Python syntax
        run: |
          python -m py_compile mullvad-privacy/tools/apply_privacy_patch.py
          python -m py_compile mullvad-privacy/tests/test_patch_static.py

      - name: Verify deterministic result
        shell: bash
        run: diff -ru upstream upstream-second

      - name: Generate source patch artifact
        shell: bash
        run: |
          diff -ruN original upstream > privacy-browser-source.patch || code=$?
          if [ "${code:-0}" -gt 1 ]; then exit "$code"; fi
          test -s privacy-browser-source.patch

      - name: Upload source patch
        uses: actions/upload-artifact@v4
        with:
          name: privacy-browser-source-patch
          path: privacy-browser-source.patch

  powershell-validation:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem mullvad-privacy/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("Parse errors in " + $_.FullName + ": " + ($errors | Out-String))
            } else {
              Write-Host ("PASS: " + $_.Name)
            }
          }
          if ($failed) { exit 1 }

      - name: Validate example JSON
        shell: pwsh
        run: |
          $config = Get-Content mullvad-privacy/config/privacy-browser.example.json -Raw | ConvertFrom-Json
          if ($config.SocksHost -ne '127.0.0.1') { throw 'default SOCKS host must be loopback' }
          if (-not $config.KillSwitch) { throw 'kill switch must be enabled by default' }
          if ($config.BrowserTimeZone -ne '') { throw 'browser timezone override must default to empty' }
          if ($config.BrowserVersion -ne '') { throw 'browser version override must default to empty' }
          Write-Host 'PASS: runtime configuration defaults'
